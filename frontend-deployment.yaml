apiVersion: apps/v1
kind: Deployment
metadata:
  name: fooderpfrontend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fooderpfrontend
  template:
    metadata:
      labels:
        app: fooderpfrontend
    spec:
      containers:
      - name: fooderpfrontend
        image: francisreddy/fooderpfrontend:DotIn
        ports:
        - containerPort: 3000
apiVersion: v1
kind: Service
metadata:
  name: fooderpfrontend-service
spec:
  selector:
    app: fooderpfrontend
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
  type: NodePort
